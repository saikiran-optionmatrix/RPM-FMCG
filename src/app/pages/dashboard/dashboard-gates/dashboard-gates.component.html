<div class="container-fluid">

  <!-- Custom Compact Header -->
  <div class="gates-header-section">
    <p class="gates-subtitle-text">Distribution of programs across Gates Gate 1 to Gate 5</p>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="app-table-container">

        <!-- Table Section -->
        <div class="table-responsive">
          <table class="table app-table styled-table"
            style="border-collapse: collapse; margin: 0; width: 100%; table-layout: fixed;">
            <thead>
              <tr>
                <th *ngFor="let head of gateHeaders" class="text-center gate-col-header">
                  <div class="gate-label fw-bold">{{ head.label }}</div>
                  <div class="gate-subtitle small mt-1">{{ head.subtitle }}</div>
                  <div class="stage-count-badge mt-2" *ngIf="head.programCount">{{ head.programCount }} Programs</div>
                </th>
              </tr>
            </thead>
            <tbody>
              @for (row of gateRows; track $index) {
              <tr>
                <td *ngFor="let head of gateHeaders" class="text-center gate-data-cell"
                  [class.matched-cell]="row[head.key] && isMatching(row[head.key])">
                  <div *ngIf="row[head.key]" [innerHTML]="highlight(row[head.key])"></div>
                  <span *ngIf="!row[head.key]" class="empty-dash text-muted opacity-50">—</span>
                </td>
              </tr>
              } @empty {
              <tr>
                <td [attr.colspan]="gateHeaders.length" class="empty-table text-center">No records found</td>
              </tr>
              }
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>
</div>
